version: "2"

run:
  timeout: 3m

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - durationcheck
    - errorlint
    - gocritic
    - gocyclo
    - goconst
    - godot
    - misspell
    - nilerr
    - noctx
    - perfsprint
    - prealloc
    - revive
    - unconvert
    - usestdlibvars
    - whitespace

  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    gocyclo:
      min-complexity: 15
    goconst:
      min-len: 5
      min-occurrences: 4
    misspell:
      locale: US

  exclusions:
    presets:
      - comments
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - goconst
          - gocyclo
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
