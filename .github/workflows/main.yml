name: Main

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

env:
  GO_VERSION: '1.23'
  GOLANGCI_LINT_VERSION: v2.13.2
  YAEGI_VERSION: v0.16.1
  CGO_ENABLED: 0

jobs:
  main:
    name: Lint, test, and interpret
    runs-on: ubuntu-latest

    env:
      GOPATH: ${{ github.workspace }}/go
    defaults:
      run:
        working-directory: ${{ github.workspace }}/go/src/github.com/${{ github.repository }}

    steps:
      - name: Check out code
        uses: actions/checkout@v4
        with:
          path: go/src/github.com/${{ github.repository }}
          fetch-depth: 0

      - name: Set up Go ${{ env.GO_VERSION }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Install golangci-lint
        run: |
          version="${GOLANGCI_LINT_VERSION#v}"
          archive="golangci-lint-${version}-linux-amd64.tar.gz"
          base="https://github.com/golangci/golangci-lint/releases/download/${GOLANGCI_LINT_VERSION}"

          tmp="$(mktemp -d)"
          curl -sSfL -o "${tmp}/${archive}" "${base}/${archive}"
          curl -sSfL -o "${tmp}/checksums.txt" "${base}/golangci-lint-${version}-checksums.txt"

          grep " ${archive}$" "${tmp}/checksums.txt" > "${tmp}/want.txt"
          test "$(wc -l < "${tmp}/want.txt")" -eq 1
          ( cd "${tmp}" && sha256sum -c want.txt )

          tar -xzf "${tmp}/${archive}" -C "${tmp}"
          mkdir -p "$(go env GOPATH)/bin"
          install -m 0755 "${tmp}/golangci-lint-${version}-linux-amd64/golangci-lint" "$(go env GOPATH)/bin/golangci-lint"

      - name: Install yaegi
        run: |
          curl -sSfL https://raw.githubusercontent.com/traefik/yaegi/master/install.sh \
            | bash -s -- -b "$(go env GOPATH)/bin" "${YAEGI_VERSION}"

      - name: Verify the module is tidy and has no vendored drift
        run: |
          go mod tidy
          git diff --exit-code go.mod

      - name: Lint
        run: "$(go env GOPATH)/bin/golangci-lint run"

      - name: Test
        env:
          CGO_ENABLED: 1
        run: go test -v -race -cover ./...

      - name: Test under the Yaegi interpreter
        run: "$(go env GOPATH)/bin/yaegi test -v ."
